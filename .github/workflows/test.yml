name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Node version from mise.toml
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Run tests
        run: node --disable-warning=ExperimentalWarning --test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Node version from mise.toml
        id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --dir apps/web test
      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --dir apps/web test:e2e
